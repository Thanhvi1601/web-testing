<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kế Hoạch Học Tập Trong Tuần</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .input-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .input-group input[type="text"],
        .input-group input[type="time"] {
            flex: 1;
            min-width: 150px;
        }

        .input-group select {
            min-width: 120px;
        }

        .input-group textarea {
            width: 100%;
            min-height: 60px;
            resize: vertical;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .day-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .day-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }

        .day-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: -20px -20px 15px -20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2em;
        }

        .task-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .task-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .task-text {
            flex: 1;
        }

        .task-time {
            font-size: 0.9em;
            color: #666;
            min-width: 60px;
        }

        .task-priority {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .priority-high {
            background: #ffebee;
            color: #c62828;
        }

        .priority-medium {
            background: #fff3e0;
            color: #e65100;
        }

        .priority-low {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .task-actions button {
            padding: 6px 10px;
            font-size: 0.9em;
            min-width: auto;
        }

        .delete-btn {
            background: #f44336;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .complete-btn {
            background: #4caf50;
        }

        .complete-btn:hover {
            background: #388e3c;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .clear-all-btn {
            background: #f44336;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input,
            .input-group select,
            .input-group textarea {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Kế Hoạch Học Tập Trong Tuần</h1>
            <p class="subtitle">Quản lý và theo dõi lịch học tập của bạn</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Tổng Nhiệm Vụ</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Hoàn Thành</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="remainingTasks">0</div>
                <div class="stat-label">Còn Lại</div>
            </div>
        </div>

        <div class="input-section">
            <h2 style="margin-bottom: 15px; color: #333;">Thêm Nhiệm Vụ Mới</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Nhập nội dung học tập..." maxlength="100">
                <select id="daySelect">
                    <option value="">Chọn ngày</option>
                    <option value="Thứ Hai">Thứ Hai</option>
                    <option value="Thứ Ba">Thứ Ba</option>
                    <option value="Thứ Tư">Thứ Tư</option>
                    <option value="Thứ Năm">Thứ Năm</option>
                    <option value="Thứ Sáu">Thứ Sáu</option>
                    <option value="Thứ Bảy">Thứ Bảy</option>
                    <option value="Chủ Nhật">Chủ Nhật</option>
                </select>
                <input type="time" id="timeInput">
                <select id="prioritySelect">
                    <option value="low">Ưu Tiên Thấp</option>
                    <option value="medium" selected>Ưu Tiên Trung Bình</option>
                    <option value="high">Ưu Tiên Cao</option>
                </select>
            </div>
            <div class="input-group">
                <textarea id="noteInput" placeholder="Ghi chú thêm (tùy chọn)..."></textarea>
            </div>
            <button onclick="addTask()">➕ Thêm Nhiệm Vụ</button>
        </div>

        <div class="schedule-grid" id="scheduleGrid">
            <!-- Các ngày sẽ được tạo động -->
        </div>

        <button class="clear-all-btn" onclick="clearAllTasks()">🗑️ Xóa Tất Cả Nhiệm Vụ</button>
    </div>

    <script>
        const days = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
        let tasks = JSON.parse(localStorage.getItem('weeklyTasks')) || {};

        // Khởi tạo cấu trúc dữ liệu cho các ngày
        days.forEach(day => {
            if (!tasks[day]) {
                tasks[day] = [];
            }
        });

        function saveTasks() {
            localStorage.setItem('weeklyTasks', JSON.stringify(tasks));
            updateStats();
            renderSchedule();
        }

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const prioritySelect = document.getElementById('prioritySelect');
            const noteInput = document.getElementById('noteInput');

            if (!taskInput.value.trim() || !daySelect.value) {
                alert('Vui lòng nhập nội dung và chọn ngày!');
                return;
            }

            const task = {
                id: Date.now(),
                text: taskInput.value.trim(),
                time: timeInput.value || '09:00',
                priority: prioritySelect.value,
                note: noteInput.value.trim(),
                completed: false
            };

            tasks[daySelect.value].push(task);
            saveTasks();

            // Xóa input
            taskInput.value = '';
            timeInput.value = '';
            prioritySelect.value = 'medium';
            noteInput.value = '';
            taskInput.focus();
        }

        function deleteTask(day, taskId) {
            tasks[day] = tasks[day].filter(task => task.id !== taskId);
            saveTasks();
        }

        function toggleComplete(day, taskId) {
            const task = tasks[day].find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        function updateStats() {
            let total = 0;
            let completed = 0;

            days.forEach(day => {
                total += tasks[day].length;
                completed += tasks[day].filter(t => t.completed).length;
            });

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('remainingTasks').textContent = total - completed;
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';

            days.forEach(day => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';

                let dayContent = `<div class="day-header">${day}</div>`;

                if (tasks[day].length === 0) {
                    dayContent += `<div class="empty-state">Không có nhiệm vụ</div>`;
                } else {
                    // Sắp xếp theo thời gian
                    const sortedTasks = [...tasks[day]].sort((a, b) => a.time.localeCompare(b.time));
                    
                    sortedTasks.forEach(task => {
                        const priorityClass = `priority-${task.priority}`;
                        const completedClass = task.completed ? 'completed' : '';
                        
                        dayContent += `
                            <div class="task-item ${completedClass}">
                                <div>
                                    <div class="task-priority ${priorityClass}">
                                        ${task.priority === 'high' ? '🔴 Cao' : task.priority === 'medium' ? '🟡 Trung Bình' : '🟢 Thấp'}
                                    </div>
                                    <div class="task-text">${task.text}</div>
                                    ${task.note ? `<div style="font-size: 0.85em; color: #666; margin-top: 5px;">📝 ${task.note}</div>` : ''}
                                </div>
                                <div class="task-time">${task.time}</div>
                                <div class="task-actions">
                                    <button class="complete-btn" onclick="toggleComplete('${day}', ${task.id})">
                                        ${task.completed ? '↩️' : '✓'}
                                    </button>
                                    <button class="delete-btn" onclick="deleteTask('${day}', ${task.id})">🗑️</button>
                                </div>
                            </div>
                        `;
                    });
                }

                dayCard.innerHTML = dayContent;
                grid.appendChild(dayCard);
            });
        }

        function clearAllTasks() {
            if (confirm('Bạn có chắc chắn muốn xóa tất cả nhiệm vụ không?')) {
                days.forEach(day => {
                    tasks[day] = [];
                });
                saveTasks();
            }
        }

        // Xử lý phím Enter
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Khởi tạo
        renderSchedule();
        updateStats();
    </script>
</body>
</html>
