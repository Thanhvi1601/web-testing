
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Space Shooter - Infinite</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 4px solid #333;
        }
        canvas {
            display: block;
            background-color: #050510;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            width: calc(100% - 20px);
        }
        .stat {
            font-size: 18px;
            margin-bottom: 5px;
            text-shadow: 2px 2px #000;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        button {
            background: #00ffff;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        button:hover {
            background: #ffffff;
            transform: scale(1.1);
        }
        .controls-hint {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
        }
        #upgrade-menu {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 40, 40, 0.9);
            padding: 15px;
            border: 2px solid #00ffff;
            flex-direction: row;
            gap: 10px;
        }
        .upgrade-btn {
            background: #222;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .upgrade-btn:disabled {
            color: #555;
            border-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="stat">SCORE: <span id="score-val">0</span></div>
        <div class="stat">LEVEL: <span id="level-val">1</span></div>
        <div class="stat">LIVES: <span id="lives-val">3</span></div>
        <div class="stat">SCRAP: <span id="scrap-val">0</span></div>
    </div>
    
    <div id="overlay">
        <h1 id="title">PIXEL SPACE SHOOTER</h1>
        <p id="msg">Protect the galaxy from the pixel invasion!</p>
        <button id="start-btn">START GAME</button>
        <div class="controls-hint">
            WASD / ARROWS to Move<br>
            SPACE to Shoot<br>
            1, 2, 3 to Upgrade (when you have Scrap)
        </div>
    </div>

    <div id="upgrade-menu">
        <button class="upgrade-btn" id="upg-speed" title="Cost: 10 Scrap">1: SPEED (10)</button>
        <button class="upgrade-btn" id="upg-fire" title="Cost: 15 Scrap">2: FIRE RATE (15)</button>
        <button class="upgrade-btn" id="upg-multi" title="Cost: 25 Scrap">3: MULTI-SHOT (25)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-val');
    const levelEl = document.getElementById('level-val');
    const livesEl = document.getElementById('lives-val');
    const scrapEl = document.getElementById('scrap-val');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const upgradeMenu = document.getElementById('upgrade-menu');

    // Game Config
    const WIDTH = 400;
    const HEIGHT = 600;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let gameActive = false;
    let score = 0;
    let level = 1;
    let scrap = 0;
    let keys = {};

    // Game Objects
    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerUps = [];

    class Player {
        constructor() {
            this.w = 30;
            this.h = 30;
            this.x = WIDTH / 2 - this.w / 2;
            this.y = HEIGHT - 60;
            this.speed = 4;
            this.lives = 3;
            this.fireRate = 400; // ms
            this.lastFire = 0;
            this.multiShot = 1;
            this.color = '#00ffff';
        }

        draw() {
            ctx.fillStyle = this.color;
            // Simple Pixel Ship Shape
            ctx.fillRect(this.x + 10, this.y, 10, 10);
            ctx.fillRect(this.x, this.y + 10, 30, 10);
            ctx.fillRect(this.x, this.y + 20, 10, 10);
            ctx.fillRect(this.x + 20, this.y + 20, 10, 10);
            
            // Engine glow
            ctx.fillStyle = Math.random() > 0.5 ? '#ffaa00' : '#ff4400';
            ctx.fillRect(this.x + 12, this.y + 30, 6, 4);
        }

        update() {
            if (keys['ArrowLeft'] || keys['a']) this.x -= this.speed;
            if (keys['ArrowRight'] || keys['d']) this.x += this.speed;
            if (keys['ArrowUp'] || keys['w']) this.y -= this.speed;
            if (keys['ArrowDown'] || keys['s']) this.y += this.speed;

            // Boundaries
            this.x = Math.max(0, Math.min(WIDTH - this.w, this.x));
            this.y = Math.max(0, Math.min(HEIGHT - this.h, this.y));

            if (keys[' '] && Date.now() - this.lastFire > this.fireRate) {
                this.shoot();
                this.lastFire = Date.now();
            }
        }

        shoot() {
            if (this.multiShot === 1) {
                bullets.push(new Bullet(this.x + this.w / 2 - 2, this.y, 0));
            } else if (this.multiShot === 2) {
                bullets.push(new Bullet(this.x + 5, this.y, 0));
                bullets.push(new Bullet(this.x + this.w - 10, this.y, 0));
            } else {
                bullets.push(new Bullet(this.x + this.w / 2 - 2, this.y, 0));
                bullets.push(new Bullet(this.x, this.y + 10, -0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 10, 0.5)) ;
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 20, -0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 20, 0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 30, -0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 30, 0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 40, -0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 40, 0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 50, -0.5));
                bullets.push(new Bullet(this.x + this.w - 4, this.y + 50, 0.5));
            }
        }
    }

    class Bullet {
        constructor(x, y, vx) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = -7;
            this.w = 4;
            this.h = 10;
        }
        draw() {
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
        }
    }

    class Enemy {
        constructor(type) {
            this.w = 30;
            this.h = 30;
            this.x = Math.random() * (WIDTH - this.w);
            this.y = -40;
            this.type = type; // 1: normal, 2: fast, 3: tank
            this.hp = type === 3 ? 3 : 1;
            this.speed = (Math.random() * 1 + 1) + (level * 0.2);
            if (type === 2) this.speed *= 2;
            this.color = type === 1 ? '#ff0055' : (type === 2 ? '#ffaa00' : '#aa00ff');
        }
        draw() {
            ctx.fillStyle = this.color;
            if (this.type === 1) {
                ctx.fillRect(this.x, this.y, 30, 20);
                ctx.fillRect(this.x + 10, this.y + 20, 10, 10);
            } else if (this.type === 2) {
                ctx.fillRect(this.x + 10, this.y, 10, 30);
                ctx.fillRect(this.x, this.y + 10, 30, 10);
            } else {
                ctx.fillRect(this.x, this.y, 30, 30);
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 5, this.y + 5, 20, 20);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + 10, this.y + 10, 10, 10);
            }
        }
        update() {
            this.y += this.speed;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 3, 3);
            ctx.globalAlpha = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
    }

    function spawnEnemy() {
        if (!gameActive) return;
        let type = 1;
        let rand = Math.random();
        if (rand > 0.8) type = 2;
        if (rand > 0.92) type = 3;
        enemies.push(new Enemy(type));
        
        let nextSpawn = Math.max(300, 1500 - (level * 100));
        setTimeout(spawnEnemy, nextSpawn);
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 10; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function init() {
        player = new Player();
        bullets = [];
        enemies = [];
        particles = [];
        score = 0;
        level = 1;
        scrap = 100000;
        updateUI();
    }

    function updateUI() {
        scoreEl.innerText = score;
        levelEl.innerText = level;
        livesEl.innerText = player.lives;
        scrapEl.innerText = scrap;
        
        document.getElementById('upg-speed').disabled = scrap < 10;
        document.getElementById('upg-fire').disabled = scrap < 15;
        document.getElementById('upg-multi').disabled = scrap < 25;
    }

    function handleUpgrades(id) {
        if (id === '1' && scrap >= 10) {
            player.speed += 0.5;
            scrap -= 10;
        } else if (id === '2' && scrap >= 15) {
            player.fireRate = Math.max(100, player.fireRate - 50);
            scrap -= 15;
        } else if (id === '3' && scrap >= 25) {
            player.multiShot = Math.min(30, player.multiShot + 1);
            scrap -= 25;
        }
        updateUI();
    }

    function gameOver() {
        gameActive = false;
        overlay.style.display = 'flex';
        upgradeMenu.style.display = 'none';
        document.getElementById('title').innerText = 'GAME OVER';
        document.getElementById('msg').innerText = `Final Score: ${score} | Level: ${level}`;
        startBtn.innerText = 'TRY AGAIN';
    }

    function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // Background Stars
        ctx.fillStyle = '#fff';
        if (Math.random() > 0.9) ctx.fillRect(Math.random() * WIDTH, 0, 1, 1);

        player.update();
        player.draw();

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].y < -20) bullets.splice(i, 1);
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.update();
            e.draw();

            // Collision with Player
            if (e.x < player.x + player.w && e.x + e.w > player.x &&
                e.y < player.y + player.h && e.y + e.h > player.y) {
                createExplosion(player.x + 15, player.y + 15, '#00ffff');
                createExplosion(e.x + 15, e.y + 15, e.color);
                enemies.splice(i, 1);
                player.lives--;
                updateUI();
                if (player.lives <= 0) gameOver();
                continue;
            }

            // Collision with Bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x < e.x + e.w && b.x + b.w > e.x &&
                    b.y < e.y + e.h && b.y + b.h > e.y) {
                    
                    e.hp--;
                    bullets.splice(j, 1);
                    
                    if (e.hp <= 0) {
                        createExplosion(e.x + 15, e.y + 15, e.color);
                        enemies.splice(i, 1);
                        score += e.type * 10;
                        scrap += e.type;
                        
                        // Level Up Logic
                        if (score > level * 500) {
                            level++;
                        }
                        updateUI();
                    }
                    break;
                }
            }

            if (e.y > HEIGHT) {
                enemies.splice(i, 1);
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    // Controls
    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (gameActive && ['1', '2', '3'].includes(e.key)) {
            handleUpgrades(e.key);
        }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    startBtn.addEventListener('click', () => {
        init();
        gameActive = true;
        overlay.style.display = 'none';
        upgradeMenu.style.display = 'flex';
        spawnEnemy();
        gameLoop();
    });

    // Upgrade buttons
    document.getElementById('upg-speed').addEventListener('click', () => handleUpgrades('1'));
    document.getElementById('upg-fire').addEventListener('click', () => handleUpgrades('2'));
    document.getElementById('upg-multi').addEventListener('click', () => handleUpgrades('3'));

</script>
</body>
</html>
